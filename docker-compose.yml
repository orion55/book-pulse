services:
  migrate:
    image: book-pulse-migrate:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    restart: "no"
    environment:
      DATABASE_URL: file:/app/dev.db
    volumes:
      - ./docker/dev.db:/app/dev.db

  app:
    image: book-pulse:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    init: true
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/dev.db
      TZ: Asia/Yekaterinburg
    volumes:
      - ./docker/dev.db:/app/dev.db
      - ./docker/config.yml:/app/config.yml:ro
      - ./docker/logs:/app/logs
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
